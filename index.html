<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ToluSupportsLocalBusinesses</title>

<!-- TSLB opening animation: no homepage content changes -->
<style id="tslb-intro-style">
  body { background: #0A0A0A; color: #FFFFFF; }
  html.tslb-opening { overflow: hidden; }
  .tslb-intro {
    position: fixed; inset: 0; z-index: 2147483647;
    display: none; place-items: center; background: #0A0A0A;
    opacity: 1; transition: opacity .48s ease;
  }
  .tslb-opening .tslb-intro { display: grid; }
  .tslb-opening .tslb-intro.is-done { opacity: 0; pointer-events: none; }
  .tslb-intro__art { position: relative; width: min(72vw, 220px); aspect-ratio: 1; }
  .tslb-intro__logo, .tslb-intro__ring {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  }
  .tslb-intro__logo { object-fit: contain; }
  .tslb-intro__ring {
    inset: 50% auto auto 50%; width: 145%; height: 145%;
    transform: translate(-50%, -48%); overflow: visible;
  }
  .tslb-intro__ring circle {
    fill: none; stroke: #FFFFFF; stroke-width: 5.5; stroke-linecap: round;
    stroke-dasharray: 2834; stroke-dashoffset: 2834;
    transform-origin: 624px 603px; transform: rotate(-90deg);
    animation: tslb-ring-draw 2.15s cubic-bezier(.35,.04,.23,1) forwards;
  }
  @keyframes tslb-ring-draw { to { stroke-dashoffset: 0; } }
  @media (max-width: 600px) { .tslb-intro__art { width: min(82vw, 190px); } }
  @media (prefers-reduced-motion: reduce) {
    .tslb-intro, .tslb-intro__ring circle { animation: none !important; transition: none !important; }
  }
</style>
<script>
(function () {
  try {
    if (sessionStorage.getItem('tslb-intro-seen') !== '1' &&
        !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('tslb-opening');
    }
  } catch (error) {
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches)
      document.documentElement.classList.add('tslb-opening');
  }
})();
</script>

<style id="tslb-home-image-style">
  html,body{margin:0;min-height:100%;width:100%}
  .tslb-home-image{position:relative;isolation:isolate;width:100%;height:100vh;height:100svh;overflow:hidden;background:#0A0A0A}
  .tslb-home-image img{
    display:block;width:100%;height:100vh;height:100svh;
    object-fit:cover;object-position:center;
    /* Keep the original shapes and colours, but substantially darker. */
    filter:brightness(.44) saturate(1.16);
    /* A gentle, moving ripple in the shapes; no added light or colours. */
    filter:brightness(.44) saturate(1.16) url(#tslb-colour-ripple);
    transform-origin:center center;
    will-change:transform;
    animation:tslb-background-flow 4.8s ease-in-out infinite;
  }
  /* Stronger organic drifting over the original artwork; no new colours or light. */
  @keyframes tslb-background-flow{
    0%,100%{transform:translate3d(-7.2%,3.5%,0) scale(1.30)}
    25%{transform:translate3d(7.2%,-6.0%,0) scale(1.32)}
    50%{transform:translate3d(7.5%,6.1%,0) scale(1.31)}
    75%{transform:translate3d(-7.3%,5.8%,0) scale(1.32)}
  }
  /* Dark translucent veil above the background, with the ripple visible below it. */
  .tslb-home-image::after{content:"";position:absolute;inset:0;z-index:1;background:rgba(0,0,0,.70);pointer-events:none}
  .tslb-home-image.is-paused img{animation-play-state:paused}
  .tslb-ripple-definitions{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
  @media(prefers-reduced-motion:reduce){
    .tslb-home-image img{filter:brightness(.44) saturate(1.16);animation:none;transform:none}
  }
</style>
</head>

<body>

  <svg class="tslb-ripple-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <defs>
      <filter id="tslb-colour-ripple" x="-2%" y="-2%" width="104%" height="104%">
        <feTurbulence type="fractalNoise" baseFrequency=".004 .005" numOctaves="1" seed="3" result="tslb-waves">
          <animate attributeName="baseFrequency" values=".004 .005;.007 .003;.0028 .007;.004 .005" dur="3.2s" repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="tslb-waves" scale="42" xChannelSelector="R" yChannelSelector="G">
          <animate attributeName="scale" values="38;65;41;62;38" dur="3.2s" repeatCount="indefinite" />
        </feDisplacementMap>
      </filter>
    </defs>
  </svg>
  <main class="tslb-home-image" tabindex="0" aria-label="Animated background. Press Enter, Space or click to pause movement.">
  <img src="/assets/tslb-home-background.png" alt="ToluSupportsLocalBusinesses colourful abstract background" width="1254" height="1254" fetchpriority="high">
</main>
<script>
(function () {
  'use strict';
  var homepage = document.querySelector('.tslb-home-image');
  var ripple = document.querySelector('.tslb-ripple-definitions');
  if (!homepage) return;

  function toggleMovement() {
    var paused = homepage.classList.toggle('is-paused');
    if (ripple) {
      if (paused && typeof ripple.pauseAnimations === 'function') {
        ripple.pauseAnimations();
      } else if (!paused && typeof ripple.unpauseAnimations === 'function') {
        ripple.unpauseAnimations();
      }
    }
    homepage.setAttribute('aria-label', paused
      ? 'Background paused. Press Enter, Space or click to resume movement.'
      : 'Animated background. Press Enter, Space or click to pause movement.');
  }

  homepage.addEventListener('click', toggleMovement);
  homepage.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      toggleMovement();
    }
  });
})();
</script>

<!-- Logo animation only. Existing homepage markup above is unchanged. -->
<div class="tslb-intro" id="tslb-intro" role="status" aria-label="ToluSupportsLocalBusinesses is opening">
  <div class="tslb-intro__art">
    <svg class="tslb-intro__logo" viewBox="194 193 850 850" aria-label="ToluSupportsLocalBusinesses logo" role="img" xmlns="http://www.w3.org/2000/svg">
      <path fill="#FFFFFF" fill-rule="evenodd" d="M432 355 H716 V396 H757 V437 H792 V473 H822 V849 H431 V355 Z M473 396 H683 V436 H725 V474 H758 V512 H783 V808 H472 V396 Z"></path>
      <path fill="#FFFFFF" d="M533 548 H715 V596 H533 Z M533 617 H715 V665 H533 Z M533 685 H715 V734 H533 Z"></path>
    </svg>
    <svg class="tslb-intro__ring" viewBox="0 0 1254 1254" aria-hidden="true">
      <circle cx="624" cy="603" r="451"></circle>
    </svg>
  </div>
</div>
<script>
(function () {
  'use strict';
  if (!document.documentElement.classList.contains('tslb-opening')) return;
  var intro = document.getElementById('tslb-intro');
  window.setTimeout(function () {
    intro.classList.add('is-done');
    try { sessionStorage.setItem('tslb-intro-seen', '1'); } catch (error) {}
    window.setTimeout(function () {
      document.documentElement.classList.remove('tslb-opening');
      intro.setAttribute('aria-hidden', 'true');
    }, 490);
  }, 2520);
})();
</script>
</body>
</html>
